<!DOCTYPE html>
<html>
    <body>
        <p>Finding the largest numnber using arguments</p>
        <p id="demo"></p>
        <script>
            function findMax () {
                var i;
                var max = 0;
                for(i = 0; i < arguments.length; i++) {
                    if (arguments[i] > max) {
                        max=arguments[i];
                    }
                }
                return max;
            }
            document.getElementById("demo").innerHTML = findMax (15,23,14,67);
        </script>
    </body>
</html>
